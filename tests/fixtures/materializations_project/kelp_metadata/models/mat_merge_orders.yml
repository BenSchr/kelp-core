kelp_models:
  - name: mat_merge_orders
    description: Fixture model for merge materialization tests
    columns:
      - name: id
        data_type: bigint
        nullable: false
      - name: name
        data_type: string
        nullable: true
      - name: updated_at
        data_type: bigint
        nullable: true
    materialization:
      mode: merge
      keys:
        - id
      sequence_by:
        - updated_at
      columns:
        include:
          - id
          - name
          - updated_at
      ignore_null_updates: true
      when_deleted: "_op = 'D'"
